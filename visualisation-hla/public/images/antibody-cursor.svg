<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Anticorps forme Y simple et élégante -->
  <defs>
    <linearGradient id="antibodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5aa0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corps principal de l'anticorps (partie verticale) -->
  <path d="M12 8 L12 20" stroke="url(#antibodyGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Bras gauche de l'anticorps -->
  <path d="M12 8 L8 4" stroke="url(#antibodyGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Bras droit de l'anticorps -->
  <path d="M12 8 L16 4" stroke="url(#antibodyGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Sites de liaison (petits cercles aux extrémités) -->
  <circle cx="8" cy="4" r="1.5" fill="url(#antibodyGradient)"/>
  <circle cx="16" cy="4" r="1.5" fill="url(#antibodyGradient)"/>
  
  <!-- Région charnière (petit cercle au centre) -->
  <circle cx="12" cy="8" r="1" fill="url(#antibodyGradient)"/>
</svg>