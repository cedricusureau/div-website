<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Anticorps forme Y avec effet pour interactivité -->
  <defs>
    <linearGradient id="antibodyActiveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5ba0f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d6bb0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Lueur pour l'effet interactif -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Halo de lueur derrière l'anticorps -->
  <g filter="url(#glow)" opacity="0.6">
    <path d="M12 8 L12 20" stroke="#87ceeb" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 8 L8 4" stroke="#87ceeb" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 8 L16 4" stroke="#87ceeb" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Corps principal de l'anticorps (partie verticale) -->
  <path d="M12 8 L12 20" stroke="url(#antibodyActiveGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Bras gauche de l'anticorps -->
  <path d="M12 8 L8 4" stroke="url(#antibodyActiveGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Bras droit de l'anticorps -->
  <path d="M12 8 L16 4" stroke="url(#antibodyActiveGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Sites de liaison (petits cercles aux extrémités) avec lueur -->
  <circle cx="8" cy="4" r="1.5" fill="url(#antibodyActiveGradient)" filter="url(#glow)"/>
  <circle cx="16" cy="4" r="1.5" fill="url(#antibodyActiveGradient)" filter="url(#glow)"/>
  
  <!-- Région charnière (petit cercle au centre) -->
  <circle cx="12" cy="8" r="1" fill="url(#antibodyActiveGradient)"/>
</svg>