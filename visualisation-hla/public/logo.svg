<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="atom1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="atom2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E94B3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C92A1A;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="atom3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#50C878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E8B57;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="atom4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D68910;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Liaisons (bonds) -->
  <line x1="70" y1="70" x2="100" y2="100" stroke="#666" stroke-width="3" opacity="0.6"/>
  <line x1="130" y1="70" x2="100" y2="100" stroke="#666" stroke-width="3" opacity="0.6"/>
  <line x1="100" y1="100" x2="100" y2="140" stroke="#666" stroke-width="3" opacity="0.6"/>
  <line x1="100" y1="100" x2="150" y2="120" stroke="#666" stroke-width="3" opacity="0.6"/>
  <line x1="70" y1="70" x2="50" y2="50" stroke="#999" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <line x1="130" y1="70" x2="150" y2="50" stroke="#999" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>

  <!-- Atomes (atoms) -->
  <circle cx="70" cy="70" r="18" fill="url(#atom1)"/>
  <circle cx="130" cy="70" r="18" fill="url(#atom2)"/>
  <circle cx="100" cy="100" r="20" fill="url(#atom3)"/>
  <circle cx="100" cy="140" r="15" fill="url(#atom4)"/>
  <circle cx="150" cy="120" r="14" fill="url(#atom1)"/>
  <circle cx="50" cy="50" r="12" fill="url(#atom2)" opacity="0.7"/>
  <circle cx="150" cy="50" r="12" fill="url(#atom3)" opacity="0.7"/>

  <!-- Halos d'interaction -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="#50C878" stroke-width="1.5" opacity="0.3"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#50C878" stroke-width="1" opacity="0.2"/>
</svg>